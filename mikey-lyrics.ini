[Rainmeter]
Update=200
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,200

[Metadata]
Name=mikey-lyrics
Author=michaeldelrosar.io
Information=Skin that makes use of WebNowPlaying-Redux (https://github.com/keifufu/WebNowPlaying-Rainmeter) and LRCLib (https://lrclib.net/) with synchronous lyrics support
Version=1.1.1
License=MIT License

[Variables]
; Editable Variables
ySplit=400
FontFace=Atkinson Hyperlegible
interfaceColor=255,255,255,255
lyricColor=255,255,255,125
activeLyricColor=255,255,255,255
barColor=30,130,76,255
SyncEnabled=1
SyncOffset=0
SyncContextLines=4
VinylMode=0

; Not-so-editable Variables
containerWidth=400
ScrollStep=20
lyricSize=10
lyricStep=1

; =================
; ==== MEASURE ====
; =================

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
UpdateDivider=5

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
UpdateDivider=5
IfCondition=(MeasureState = 1)
IfTrueAction=[!SetOption MeterPlayPause Text "pause"][!UpdateMeter MeterPlayPause][!Redraw]
IfFalseAction=[!SetOption MeterPlayPause Text "play_circle"][!UpdateMeter MeterPlayPause][!Redraw]
IfConditionMode=1

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
UpdateDivider=1

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
UpdateDivider=2

[MeasureAlbum]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Album
UpdateDivider=2

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration
UpdateDivider=2

[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
UpdateDivider=1

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
UpdateDivider=5

; ================
; = LRCLib Parse =
; ================

[MeasureLyricsRaw]
Measure=WebParser
URL=
Header=User-Agent: mikey-lyrics/1.1.1 (https://github.com/mjdelro/mikey-lyrics)
CodePage=65001
UpdateDivider=-1
UpdateRate=1
RegExp=(?si)(.*)
FinishAction=[!UpdateMeasure MeasureLyricsBody][!CommandMeasure MeasureLyricsScript "OnLyricsFetched()"]
OnConnectErrorAction=[!CommandMeasure MeasureLyricsScript "OnLyricsError()"]
OnRegExpErrorAction=[!CommandMeasure MeasureLyricsScript "OnLyricsError()"]

[MeasureLyricsBody]
Measure=WebParser
URL=[MeasureLyricsRaw]
StringIndex=1

[MeasureLyricsScript]
Measure=Script
ScriptFile=#@#Scripts\Lyrics.lua
UpdateDivider=1

; ================
; ==== LYRICS ====
; ================

[lyricContainer]
Meter=Shape
Shape=Rectangle 0,0,#containerWidth#,#ySplit#
MouseScrollUpAction=[!CommandMeasure MeasureLyricsScript "ScrollLyrics(-#ScrollStep#)"]
MouseScrollDownAction=[!CommandMeasure MeasureLyricsScript "ScrollLyrics(#ScrollStep#)"]

; Plain Lyrics View
[MeterLyrics]
Meter=String
Group=PlainLyrics
X=(#containerWidth#/2)
Y=40
W=(#containerWidth#-20)
Padding=10,10,10,10
ClipString=2
StringAlign=Center
FontFace=#FontFace#
FontSize=#lyricSize#
FontColor=#lyricColor#
AntiAlias=1
Text="No track playing."
Container=lyricContainer

; Synchronous Lyrics View
[MeterLyricsPrev]
Meter=String
Group=SyncedLyrics
Hidden=1
X=(#containerWidth#/2)
Y=(#ySplit#/2-20)
W=(#containerWidth#-30)
Padding=10,4,10,4
ClipString=2
StringAlign=CenterBottom
FontFace=#FontFace#
FontSize=#lyricSize#
FontColor=#lyricColor#
AntiAlias=1
Text=""
Container=lyricContainer

[MeterLyricsCurrent]
Meter=String
Group=SyncedLyrics
Hidden=1
X=(#containerWidth#/2)
Y=(#ySplit#/2-8)
W=(#containerWidth#-30)
Padding=10,4,10,4
ClipString=2
StringAlign=CenterTop
StringStyle=Bold
FontFace=#FontFace#
FontSize=(#lyricSize#+2)
FontColor=#activeLyricColor#
AntiAlias=1
Text=""
Container=lyricContainer

[MeterLyricsNext]
Meter=String
Group=SyncedLyrics
Hidden=1
X=(#containerWidth#/2)
Y=10R
W=(#containerWidth#-30)
Padding=10,4,10,4
ClipString=2
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=#lyricSize#
FontColor=#lyricColor#
AntiAlias=1
Text=""
Container=lyricContainer

[MeterSyncToggle]
Meter=String
Hidden=1
X=10
Y=10
FontColor=#lyricColor#
AntiAlias=1
FontFace=Material Icons Outlined
FontSize=16
Text="sync"
ToolTipText="Synced lyrics: ON (click for plain)"
Container=lyricContainer
LeftMouseUpAction=[!CommandMeasure MeasureLyricsScript "ToggleSync()"]
MouseOverAction=[!SetOption MeterSyncToggle FontColor #interfaceColor#][!UpdateMeter MeterSyncToggle][!Redraw]
MouseLeaveAction=[!SetOption MeterSyncToggle FontColor #lyricColor#][!UpdateMeter MeterSyncToggle][!Redraw]

; ================
; ==== PLAYER ====
; ================

[playerContainer]
Meter=Shape
Shape=Rectangle 0,0,#containerWidth#,200
Y=#ySplit#

[scrollLyricUp]
Meter=String
Group=PlainLyrics
X=(#containerWidth#-30)
Y=10
FontColor=#interfaceColor#
AntiAlias=1
FontFace=Material Icons Outlined
FontSize=16
Text="keyboard_double_arrow_up"
Container=lyricContainer
LeftMouseDownAction=[!CommandMeasure MeasureLyricsScript "ScrollLyrics(-#ScrollStep#)"]

[scrollLyricDown]
Meter=String
Group=PlainLyrics
X=(#containerWidth#-30)
Y=10
FontColor=#interfaceColor#
AntiAlias=1
FontFace=Material Icons Outlined
FontSize=16
Text="keyboard_double_arrow_down"
Container=playerContainer
LeftMouseDownAction=[!CommandMeasure MeasureLyricsScript "ScrollLyrics(#ScrollStep#)"]

[lyricFontSizeUp]
Meter=String
X=(#containerWidth#-380)
Y=30
FontColor=0,0,0,0
FontFace=Material Icons Outlined
FontSize=18
Text="text_increase"
AntiAlias=1
Container=playerContainer
LeftMouseDownAction=[!CommandMeasure MeasureLyricsScript "AdjustFontSize(#lyricStep#)"]
MouseOverAction=[!SetOption lyricFontSizeUp FontColor #interfaceColor#][!UpdateMeter lyricFontSizeUp][!Redraw]
MouseLeaveAction=[!SetOption lyricFontSizeUp FontColor 0,0,0,0][!UpdateMeter lyricFontSizeUp][!Redraw]

[lyricFontSizeDown]
Meter=String
X=(#containerWidth#-350)
Y=30
FontColor=0,0,0,0
FontFace=Material Icons Outlined
FontSize=18
Text="text_decrease"
AntiAlias=1
Container=playerContainer
LeftMouseDownAction=[!CommandMeasure MeasureLyricsScript "AdjustFontSize(-#lyricStep#)"]
MouseOverAction=[!SetOption lyricFontSizeDown FontColor #interfaceColor#][!UpdateMeter lyricFontSizeDown][!Redraw]
MouseLeaveAction=[!SetOption lyricFontSizeDown FontColor 0,0,0,0][!UpdateMeter lyricFontSizeDown][!Redraw]

[MeterCover]
Meter=Image
MeasureName=MeasureCover
X=10
Y=60
W=100
H=100
PreserveAspectRatio=2
AntiAlias=1
Container=playerContainer
LeftMouseUpAction=[!CommandMeasure MeasureLyricsScript "ToggleVinyl()"]

[MeterCoverVinylMask]
Meter=Shape
X=10
Y=60
Shape=Ellipse 50,50,50,50
Container=playerContainer
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureLyricsScript "ToggleVinyl()"]

[MeterCoverVinyl]
Meter=Image
MeasureName=MeasureCover
X=0
Y=0
W=100
H=100
PreserveAspectRatio=2
ImageRotate=0
AntiAlias=1
Container=MeterCoverVinylMask
Hidden=1

[MeterVinylRim]
Meter=Shape
X=10
Y=60
Shape=Ellipse 50,50,49,49 | Fill Color 0,0,0,0 | StrokeWidth 3 | Stroke Color 18,18,18,240
Shape2=Ellipse 50,50,9,9 | Fill Color 16,16,16,245 | StrokeWidth 2 | Stroke Color 255,255,255,70
Container=playerContainer
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureLyricsScript "ToggleVinyl()"]

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=120
Y=60
W=(#containerWidth#-130)
FontSize=16
AntiAlias=1
FontColor=#interfaceColor#
FontFace=#FontFace#
Text="%1"
ClipString=1
Container=playerContainer

[MeterIconArtist]
Meter=String
X=120
Y=90
FontColor=#interfaceColor#
AntiAlias=1
FontFace=Material Icons Outlined
FontSize=16
Text="person"
Container=playerContainer

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=145
Y=92
W=(#containerWidth#-155)
FontColor=#interfaceColor#
FontFace=#FontFace#
AntiAlias=1
Text="%1"
ClipString=1
Container=playerContainer

[MeterIconAlbum]
Meter=String
X=120
Y=110
FontColor=#interfaceColor#
AntiAlias=1
FontFace=Material Icons Outlined
FontSize=16
Text="album"
Container=playerContainer

[MeterAlbum]
Meter=String
MeasureName=MeasureAlbum
X=145
Y=112
W=(#containerWidth#-155)
FontColor=#interfaceColor#
FontFace=#FontFace#
AntiAlias=1
Text="%1"
ClipString=1
Container=playerContainer

[MeterPrev]
Meter=String
X=120
Y=140
FontSize=22
AntiAlias=1
FontColor=#interfaceColor#
FontFace=Material Icons Outlined
Text="skip_previous"
LeftMouseUpAction=[!CommandMeasure "MeasureTitle" "Previous"]
Container=playerContainer

[MeterPlayPause]
Meter=String
X=5R
Y=140
FontSize=22
AntiAlias=1
FontColor=#interfaceColor#
FontFace=Material Icons Outlined
Text="play_circle"
LeftMouseDownAction=[!CommandMeasure "MeasureTitle" "PlayPause"]
Container=playerContainer

[MeterNext]
Meter=String
X=5R
Y=140
FontSize=22
AntiAlias=1
FontColor=#interfaceColor#
FontFace=Material Icons Outlined
Text="skip_next"
LeftMouseUpAction=[!CommandMeasure "MeasureTitle" "Next"]
Container=playerContainer

[MeterTime]
Meter=String
MeasureName=MeasurePosition
MeasureName2=MeasureDuration
X=(#containerWidth#-10)
Y=150
StringAlign=Right
AntiAlias=1
FontColor=#interfaceColor#
FontFace=#FontFace#
Text="%1 / %2"
Container=playerContainer

[MeterProgress]
Meter=BAR
MeasureName=MeasureProgress
X=10
Y=5R
W=(#containerWidth#-20)
H=10
AntiAlias=1
BarColor=#barColor#
SolidColor=150,150,150,255
BarOrientation=Horizontal
LeftMouseDownAction=[!CommandMeasure MeasureProgress "SetPosition $MouseX:%$"][!UpdateMeasure MeasureProgress][!Redraw]
Container=playerContainer
